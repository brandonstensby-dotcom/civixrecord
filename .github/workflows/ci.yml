name: CivixRecord CI & Architecture Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Py ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev]

      - name: Code Quality & Linting
        run: |
          ruff check civixrecord

      - name: Run Hermetic Unit Test Suite
        run: |
          pytest civixrecord/tests --cov=civixrecord --cov-report=term-missing

      - name: Verify CLI Subcommands
        run: |
          civixrecord --version
          civixrecord doctor
          civixrecord bridge --probe
          civixrecord bridge --benchmark

  build-distribution:
    name: Wheel & Source Distribution Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Wheel & Tarball
        run: |
          python -m build

      - name: Validate Package Metadata
        run: |
          twine check dist/*
