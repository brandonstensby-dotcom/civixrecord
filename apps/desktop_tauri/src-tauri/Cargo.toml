[package]
name = "civixrecord-desktop"
version = "0.4.1"
description = "CivixRecord Desktop Native WASAPI / CoreAudio Virtual Loopback Daemon"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
cpal = "0.15.3"
log = "0.4.22"
env_logger = "0.11.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation"
] }
